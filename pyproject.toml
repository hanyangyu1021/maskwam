[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maskwam"
version = "0.1.0"
description = "MaskWAM: Unifying Mask Prompting and Prediction for World-Action Models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hanyang Yu" }]
keywords = ["world model", "robot learning", "robot manipulation"]
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["checkpoint_loader", "dataset_T_real", "dataset_T_sim", "paths"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = [
  "data*",
  "mask_wan_mot_real*",
  "mask_wan_mot_sim*",
  "platforms*",
  "playground*",
  "utils*",
  "wan22_core*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
